name: Build resume PDF from Overleaf sync

on:
  push:
    branches: [overleaf-source]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Overleaf source
        uses: actions/checkout@v4
        with:
          ref: overleaf-source
          path: overleaf-source

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Pablo_Rosa_resume.tex
          working_directory: overleaf-source

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          path: site

      - name: Publish PDF to repo root
        run: cp overleaf-source/Pablo_Rosa_resume.pdf site/PabloRosaResume.pdf

      - name: Commit updated PDF
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PabloRosaResume.pdf
          git diff --cached --quiet || git commit -m "Auto-update resume PDF from Overleaf sync"
          git push
